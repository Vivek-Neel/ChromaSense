[env:m5stack-core2]
platform = espressif32@6.13.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
board_build.partitions = huge_app.csv
lib_deps = m5stack/M5Unified@^0.2.17
